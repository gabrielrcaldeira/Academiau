<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0b0f17"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="10 15" opacity="0.6"/>
  
  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.8"/>

  <!-- Dumbbell Icon Design -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Main Bar -->
    <rect x="-120" y="-12" width="240" height="24" rx="6" fill="#f8fafc" filter="url(#glow)"/>
    
    <!-- Left Inner Weight Plate -->
    <rect x="-150" y="-50" width="30" height="100" rx="10" fill="url(#plateGrad)"/>
    <rect x="-160" y="-40" width="10" height="80" rx="5" fill="#a855f7"/>
    
    <!-- Right Inner Weight Plate -->
    <rect x="120" y="-50" width="30" height="100" rx="10" fill="url(#plateGrad)"/>
    <rect x="150" y="-40" width="10" height="80" rx="5" fill="#00f0ff"/>
    
    <!-- Left Hand Grip Details -->
    <line x1="-80" y1="-12" x2="-80" y2="12" stroke="#0b0f17" stroke-width="2"/>
    <line x1="-40" y1="-12" x2="-40" y2="12" stroke="#0b0f17" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#0b0f17" stroke-width="2"/>
    <line x1="40" y1="-12" x2="40" y2="12" stroke="#0b0f17" stroke-width="2"/>
    <line x1="80" y1="-12" x2="80" y2="12" stroke="#0b0f17" stroke-width="2"/>
  </g>

  <!-- Title Text inside Icon (Alternative decoration) -->
  <text x="256" y="420" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="36" font-weight="800" text-anchor="middle" letter-spacing="2">GLOWFIT</text>

  <!-- Gradients & Filters Definitions -->
  <defs>
    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Plate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
</svg>
